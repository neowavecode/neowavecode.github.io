<!DOCTYPE html>

        rel="stylesheet">
    <style>
        :root {
            --neon-green: #22f5a0;
        }

        .confirm-wrap {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            letter-spacing: 2px;
            margin-bottom: 34px;
        }

        .brand img {
            height: 42px;
            width: auto;
            filter: drop-shadow(0 0 8px rgba(0, 243, 255, 0.4));
        }

        .confirm-card {
            background: var(--card-bg);
            padding: 48px 40px;
            border-radius: 22px;
            border: 1px solid rgba(34, 245, 160, 0.55);
            max-width: 520px;
            width: 100%;
            box-sizing: border-box;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 40px rgba(34, 245, 160, 0.12);
        }

        .confirm-card.state-error {
            border-color: rgba(255, 196, 0, 0.55);
            box-shadow: 0 0 40px rgba(255, 196, 0, 0.12);
        }

        /* Animated icon */
        .icon-badge {
            width: 108px;
            height: 108px;
            margin: 0 auto 28px;
        }

        .icon-badge svg {
            width: 100%;
            height: 100%;
        }

        .ring {
            fill: none;
            stroke: var(--neon-green);
            stroke-width: 4;
            stroke-dasharray: 289;
            stroke-dashoffset: 289;
            animation: draw 0.7s ease-out forwards;
            filter: drop-shadow(0 0 6px rgba(34, 245, 160, 0.7));
        }

        .tick {
            fill: none;
            stroke: var(--neon-green);
            stroke-width: 6;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 60;
            stroke-dashoffset: 60;
            animation: draw 0.4s 0.55s ease-out forwards;
            filter: drop-shadow(0 0 6px rgba(34, 245, 160, 0.7));
        }

        .state-error .ring {
            stroke: #ffc400;
            filter: drop-shadow(0 0 6px rgba(255, 196, 0, 0.7));
        }

        .state-error .tick {
            stroke: #ffc400;
            filter: drop-shadow(0 0 6px rgba(255, 196, 0, 0.7));
        }

        @keyframes draw {
            to {
                stroke-dashoffset: 0;
            }
        }

        .confirm-card h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.9rem;
            line-height: 1.2;
            margin: 0 0 18px;
            color: var(--neon-green);
            text-shadow: 0 0 12px rgba(34, 245, 160, 0.4);
        }

        .state-error h1 {
            color: #ffc400;
            text-shadow: 0 0 12px rgba(255, 196, 0, 0.4);
        }

        .confirm-card p {
            font-size: 1.12rem;
            line-height: 1.65;
            color: #e6ecf5;
            margin: 0 auto 10px;
            max-width: 420px;
        }

        .close-hint {
            font-size: 0.9rem;
            color: #8b95a7;
            margin-top: 24px;
        }

        footer {
            margin-top: 40px;
        }

        /* RTL */
        html[dir="rtl"] .brand {
            direction: rtl;
        }

        @media (max-width: 600px) {
            .confirm-card {
                padding: 38px 24px;
            }

            .confirm-card h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>

        const RTL = ["ar", "he", "fa"];

        function detectLang() {
            const q = new URLSearchParams(window.location.search);
            const forced = (q.get("lang") || "").toLowerCase();
            if (translations[forced]) return forced;
            const raw = (navigator.language || navigator.userLanguage || "en").toLowerCase();
            let base = raw.split("-")[0];
            if (!translations[base]) base = "en";
            return base;
        }

        function isErrorState() {
            // Supabase appends error / error_code / error_description on failed verification,
            // in the query string and/or the URL hash fragment.
            const q = new URLSearchParams(window.location.search);
            const h = new URLSearchParams(window.location.hash.replace(/^#/, ""));
            return !!(q.get("error") || q.get("error_code") || q.get("error_description")
                || h.get("error") || h.get("error_code") || h.get("error_description"));
        }

        (function render() {
            const lang = detectLang();
            const t = translations[lang] || translations.en;
            const rtl = RTL.indexOf(lang) !== -1;

            document.documentElement.lang = lang;
            document.documentElement.dir = rtl ? "rtl" : "ltr";

            const card = document.getElementById("card");
            const titleEl = document.getElementById("title");
            const bodyEl = document.getElementById("body");
            const hintEl = document.getElementById("hint");

            if (isErrorState()) {
                card.classList.add("state-error");
                // Morph the check into an "X" for the error state.
                document.getElementById("tickPath").setAttribute("d", "M35 35 L65 65 M65 35 L35 65");
                titleEl.textContent = t.errorTitle;
                bodyEl.textContent = t.errorBody;
                hintEl.style.display = "none";
                document.title = t.errorTitle + " · Bubble Speed";
            } else {
                titleEl.textContent = t.successTitle;
                bodyEl.textContent = t.successBody;
                hintEl.textContent = t.closeHint;
                document.title = t.successTitle + " · Bubble Speed";
            }
        })();
    </script>
